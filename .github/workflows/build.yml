name: Build

# Every push and pull request builds the macOS apps (artifacts on the run).
# Pushing a tag like agentwarp-v0.1.0 also publishes them as a GitHub Release
# (prefixed so TurboWarp's own v* tags from upstream never trigger a release).
on:
  push:
    branches: [main]
    tags: ['agentwarp-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout (with the agentwarp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Fetch library files, packager and extensions
        run: npm run fetch
      - name: Compile the editor
        run: npm run webpack:prod
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - name: Stage the agentwarp engine and panel
        run: node scripts/stage-agentwarp.mjs --arch=${{ matrix.arch }}
      - name: Package
        run: node release-automation/build.mjs --mac --${{ matrix.arch }} --production
        # Without Apple signing secrets the app is signed ad hoc (see README: first launch).
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentWarp-mac-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/agentwarp-v')
    needs: mac
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "AgentWarp ${GITHUB_REF_NAME#agentwarp-}" \
            --notes "Download the .dmg for your Mac: **arm64** for Apple Silicon (M1 and later), **x64** for Intel.

          Before the first run, install and sign in to at least one agent CLI (Claude Code, Codex or OpenCode). See the [setup guide](https://github.com/$GITHUB_REPOSITORY#install).

          The app is not notarized yet: the first time, right-click AgentWarp in Applications and choose **Open**."
        env:
          GH_TOKEN: ${{ github.token }}
