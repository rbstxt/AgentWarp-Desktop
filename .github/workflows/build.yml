name: Build

# Every push and pull request builds the apps for macOS, Windows and Linux (artifacts on the run).
# Pushing a tag like agentwarp-v0.1.0 also publishes them as a GitHub Release
# (prefixed so TurboWarp's own v* tags from upstream never trigger a release).
on:
  push:
    branches: [main]
    tags: ['agentwarp-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            arch: arm64
            package: --mac --arm64
            files: dist/*.dmg
          - name: macOS x64
            os: macos-latest
            arch: x64
            package: --mac --x64
            files: dist/*.dmg
          - name: Windows x64
            os: windows-latest
            arch: x64
            package: --windows --x64
            files: dist/*.exe
          - name: Linux x64
            os: ubuntu-latest
            arch: x64
            package: --appimage --tarball --x64
            files: |
              dist/*.AppImage
              dist/*.tar.gz
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The agentwarp submodule, without eval/ (not part of the app; some of its file names are
      # not valid on Windows).
      - name: Checkout the agentwarp submodule
        run: |
          sha=$(git rev-parse HEAD:agentwarp)
          url=$(git config -f .gitmodules submodule.agentwarp.url)
          rm -rf agentwarp
          git clone --no-checkout --filter=blob:none "$url" agentwarp
          git -C agentwarp sparse-checkout set --no-cone '/*' '!/eval/'
          git -C agentwarp checkout --quiet "$sha"
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Fetch library files, packager and extensions
        run: npm run fetch
      - name: Compile the editor
        run: npm run webpack:prod
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - name: Stage the agentwarp engine and panel
        run: node scripts/stage-agentwarp.mjs --arch=${{ matrix.arch }}
      - name: Package
        run: node release-automation/build.mjs ${{ matrix.package }} --production
        # Without signing secrets: macOS is signed ad hoc, Windows is unsigned (see README).
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentWarp-${{ runner.os }}-${{ matrix.arch }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/agentwarp-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AgentWarp ${GITHUB_REF_NAME#agentwarp-}" \
            --notes "Downloads:
          - **macOS**: the .dmg (**arm64** for Apple Silicon, **x64** for Intel). Not notarized yet: the first time, right-click AgentWarp in Applications and choose **Open**.
          - **Windows** (x64): AgentWarp-Setup-….exe. Not signed yet: if SmartScreen warns, choose **More info → Run anyway**.
          - **Linux** (x64): the .AppImage (make it executable and run it) or the .tar.gz.

          Windows and Linux builds are new and less tested than macOS; please report problems in Issues.

          Before the first run you need an agent: Claude Code (Claude Pro/Max), Codex CLI (ChatGPT plans) or, without a subscription, OpenCode with its free models. The app walks you through it; see also the [setup guide](https://github.com/$GITHUB_REPOSITORY#install)."
        env:
          GH_TOKEN: ${{ github.token }}
